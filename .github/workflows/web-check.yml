name: Check web service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t video-downloader .
      - name: Check health endpoint
        run: |
          docker run -d --name video-downloader -p 10000:10000 video-downloader
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/health; then exit 0; fi
            sleep 2
          done
          docker logs video-downloader
          exit 1
